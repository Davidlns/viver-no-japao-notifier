name: YouTube Notifier

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youtube-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: node index.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL_VIDEOS: ${{ secrets.DISCORD_WEBHOOK_URL_VIDEOS }}

      - name: Commit estado atualizado (se mudou)
        run: |
          if ! git diff --quiet -- last_video.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_video.json
            git commit -m "chore: atualiza last_video.json [skip ci]"
            git push
          else
            echo "Nenhuma mudança em last_video.json"
          fi
